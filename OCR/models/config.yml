aug:
  image_aug: true
  masked_language_model: true
backbone: vgg19_bn
cnn:
  hidden: 256
  ks:
  - - 2
    - 2
  - - 2
    - 2
  - - 2
    - 1
  - - 2
    - 1
  - - 1
    - 1
  pretrained: false
  ss:
  - - 2
    - 2
  - - 2
    - 2
  - - 2
    - 1
  - - 2
    - 1
  - - 1
    - 1
dataloader:
  num_workers: 0
  pin_memory: true
dataset:
  data_root: /kaggle/working/vietocr_data/images/
  image_height: 32
  image_max_width: 512
  image_min_width: 32
  name: mcocr_receipt
  train_annotation: train_annotation.txt
  valid_annotation: val_annotation.txt
device: cuda:0
optimizer:
  max_lr: 0.0003
  pct_start: 0.1
predictor:
  beamsearch: false
pretrain: https://vocr.vn/data/vietocr/vgg_transformer.pth
quiet: false
seq_modeling: transformer
trainer:
  batch_size: 16
  checkpoint: /kaggle/working/receipt_ocr_artifacts/vietocr_checkpoint.pth
  export: /kaggle/working/receipt_ocr_artifacts/vietocr_receipt.pth
  iters: 8000
  log: /kaggle/working/receipt_ocr_artifacts/train.log
  metrics: null
  print_every: 200
  valid_every: 2000
transformer:
  d_model: 256
  dim_feedforward: 2048
  max_seq_length: 1024
  nhead: 8
  num_decoder_layers: 6
  num_encoder_layers: 6
  pos_dropout: 0.1
  trans_dropout: 0.1
